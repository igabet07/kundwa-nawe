<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - KUNDWA NAWE</title>
</head>

<body>

<h1>❤️ KUNDWA NAWE</h1>

<h2>Iyandikishe</h2>

<form>

<input id="name" type="text" placeholder="Amazina yawe"><br><br>

<input id="age" type="number" placeholder="Imyaka"><br><br>

<input id="email" type="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button type="button" id="signupBtn">Iyandikishe</button>
</form>

<p>
Usanzwe ufite konti?
<a href="login.html">Login</a>
</p>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCn_ns4nqZUb4iWB_G0xt4dzMTL3Zn1ROs",
  authDomain: "kundwa-nawe.firebaseapp.com",
  projectId: "kundwa-nawe",
  storageBucket: "kundwa-nawe.firebasestorage.app",
  messagingSenderId: "147699605597",
  appId: "1:147699605597:web:e736c381cd43da7f666db4",
  measurementId: "G-5NCWX0BM0H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("signupBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      alert("Kwiyandikisha byagenze neza!");
      window.location.href = "profile.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});

</script>

</body>
</html>
