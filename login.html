<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - KUNDWA NAWE</title>

<style>
body{
font-family:Arial,sans-serif;
background:#fff0f5;
margin:0;
}

.container{
width:90%;
max-width:400px;
margin:50px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
color:#e91e63;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#e91e63;
color:white;
border:none;
border-radius:25px;
font-size:18px;
cursor:pointer;
}

a{
color:#e91e63;
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h2>🔐 Injira</h2>

<form>

<input id="email" type="email" placeholder="Andika Email yawe" required>

 <input id="password" type="password" placeholder="Andika Password" required>

<button type="button" id="loginBtn">Injira</button>
</form>

<p style="text-align:center;">
Nta konti ufite?
<a href="signup.html">Iyandikishe</a>
</p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCn_ns4nqZUb4iWB_G0xt4dzMTL3Zn1ROs",
  authDomain: "kundwa-nawe.firebaseapp.com",
  projectId: "kundwa-nawe",
  storageBucket: "kundwa-nawe.firebasestorage.app",
  messagingSenderId: "147699605597",
  appId: "1:147699605597:web:e736c381cd43da7f666db4",
  measurementId: "G-5NCWX0BM0H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Winjiye neza!");
      window.location.href = "profile.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});

</script>

</body>
</html>
